[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[project]
name = "blaise-daybatch-functions"
version = "0.1.0"
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "notifications-python-client>=10.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mock>=5.2.0",
    "requests-mock>=1.12.1",
    "behave>=1.2.6",
    "coverage>=7.10.6",
    "pytest-cov>=6.3.0",
    "ruff (>=0.17.0,<0.18.0)",
    "vulture (>=2.16,<3.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "pyright (>=1.1.414,<2.0.0)"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "C90", "SIM", "RUF", "Q"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
"tests/features/steps/steps.py" = ["F811"]

[tool.pyright]
include = ["models"]
typeCheckingMode = "strict"

[tool.vulture]
min_confidence = 70

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.report]
omit = ["tests/*"]